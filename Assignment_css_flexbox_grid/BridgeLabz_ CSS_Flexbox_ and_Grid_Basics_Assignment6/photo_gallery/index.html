<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="gallery">
    <figure>
      <img src="https://picsum.photos/400/300?random=1" alt="Nature 1">
      <figcaption>Beautiful Mountains</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/400/300?random=2" alt="Nature 2">
      <figcaption>Sunny Beach</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/400/300?random=3" alt="Nature 3">
      <figcaption>Forest Pathway</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/400/300?random=4" alt="Nature 4">
      <figcaption>Snowy Peaks</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/400/300?random=5" alt="Nature 5">
      <figcaption>Calm Lake</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/400/300?random=6" alt="Nature 6">
      <figcaption>Desert Dunes</figcaption>
    </figure>
  </section>
</body>
</html>
