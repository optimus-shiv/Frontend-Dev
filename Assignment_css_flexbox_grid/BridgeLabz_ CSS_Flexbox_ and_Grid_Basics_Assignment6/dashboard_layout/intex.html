<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dashboard Grid Layout -->
  <div class="dashboard">
    
    <!-- Header -->
    <header class="header">
      <h1>My Dashboard</h1>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
      <nav>
        <a href="#">Overview</a>
        <a href="#">Analytics</a>
        <a href="#">Reports</a>
        <a href="#">Settings</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <div class="box box1">Box 1</div>
      <div class="box box2">Box 2</div>
      <div class="box box3">Box 3</div>
      <div class="box box4">Box 4 (Spans 2 Columns)</div>
    </main>
  </div>
</body>
</html>
