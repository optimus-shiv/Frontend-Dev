<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card-container">
    <div class="card">
      <div class="card-front">
        <img src="https://picsum.photos/300/200" alt="Front Image">
        <h2>Nature View</h2>
      </div>
      <div class="card-back">
        <p>
          Discover the beauty of nature through this stunning landscape.
          Enjoy peaceful scenery and vibrant colors that refresh your soul.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
